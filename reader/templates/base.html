<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Auris{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/experience.css">
{% block head %}{% endblock %}
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">Auris<span class="brand-sub">Reader</span></a>
  <span class="nav-links">
    <a href="/" id="nav-library"{% if request.path == '/' %} class="active"{% endif %}>Könyvtár</a>
    <a href="/jobs"{% if request.path == '/jobs' %} class="active"{% endif %}>Feladatok</a>
    <a href="/settings" id="nav-settings"{% if request.path == '/settings' %} class="active"{% endif %}>Beállítások</a>
    <a href="/docs" id="nav-docs"{% if request.path == '/docs' %} class="active"{% endif %}>Súgó</a>
    <span id="model-badge" class="badge badge-loading" role="status" aria-live="polite">Ellenőrzés…</span>
  </span>
</nav>
{% block content %}{% endblock %}
<script>
(function applyTheme() {
  const t = localStorage.getItem('theme') || 'night';
  if (t !== 'night') document.body.classList.add('theme-' + t);
})();

async function pollModelStatus() {
  const badge = document.getElementById('model-badge');
  if (!badge) return;
  try {
    const r = await fetch('/api/tts/status');
    const s = await r.json();
    badge.className = 'badge';
    if (s.state === 'ready') {
      badge.textContent = 'Hang kész';
      badge.classList.add('badge-ready');
    } else if (s.state === 'loading') {
      badge.textContent = 'Modell betöltése';
      badge.classList.add('badge-loading');
    } else if (s.state === 'error') {
      badge.textContent = 'Hanghiba';
      badge.classList.add('badge-error');
      badge.title = s.message || '';
    } else {
      badge.textContent = s.model_exists ? 'Hang készenlétben' : 'Modell hiányzik';
      badge.classList.add(s.model_exists ? 'badge-idle' : 'badge-error');
    }
  } catch(e) { /* ignore */ }
  setTimeout(pollModelStatus, 3000);
}
pollModelStatus();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
